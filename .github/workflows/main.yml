name: Run API Tests

on:
  workflow_dispatch:  # Позволяет запускать вручную из интерфейса GitHub
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt
        
    - name: Create .env file
      run: |
        echo "Creating .env file with secrets..."
        cat > tests/.env << EOF
        base_url=${{ secrets.BASE_URL }}
        username=${{ secrets.USERNAME }}
        password=${{ secrets.PASSWORD }} 
        security_key=${{ secrets.SECURITY_KEY }}
        EOF
        
        echo "Checking created .env file:"
        cat tests/.env
        
    - name: Debug - Check if .env file exists
      run: |
        echo "Checking if .env file exists in tests/:"
        ls -la tests/.env || echo ".env file not found!"
        
    - name: Debug - Check secrets are set
      run: |
        echo "BASE_URL length: ${#BASE_URL}"
        echo "USERNAME length: ${#USERNAME}"
        echo "PASSWORD length: ${#PASSWORD}"
        echo "SECURITY_KEY length: ${#SECURITY_KEY}"
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
        SECURITY_KEY: ${{ secrets.SECURITY_KEY }}
        
    - name: Run tests with pytest
      run: |
        pytest tests/ -v --alluredir=allure-results -s
        
    - name: Generate Allure report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_report: allure-report
        keep_reports: 20
        
    - name: Upload Allure report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report
        retention-days: 30
